# Scheduled data refresh — trigger, then VERIFY.
#
# POST /api/refresh returns as soon as the background task starts, so a 200 is
# "refresh began", not "data updated". A cron that only checks the status code
# would report success while silently serving stale data. This workflow polls
# the run to completion and then gates on actual freshness + system health
# (docs/cutover-plan.md §5).
#
# Cadence: twice each weekday. GitHub cron is fixed-UTC (no DST): 14:00 UTC is
# ~09:00/10:00 ET (after the open), 21:30 UTC is ~16:30/17:30 ET (after the
# close). The backend's _refresh_lock makes overlapping/extra runs safe.
#
# Enablement is a repository VARIABLE, not a secret: `vars` may be used in a
# job-level `if`, `secrets` may not. That gives three honest outcomes —
#   REFRESH_ENABLED unset/false : the job is skipped, so the run shows "skipped".
#                                 (It used to show green "success" for doing
#                                 nothing, which hid an undeployed backend for
#                                 weeks.)
#   enabled, secrets missing    : the job fails at once with a clear error.
#   enabled and configured      : the gates below decide.
# A manual run (workflow_dispatch) always executes, so a person testing the
# setup gets loud feedback either way.
#
# Setup (cutover Phase D): repo variable REFRESH_ENABLED=true; repo secrets
# BACKEND_URL (https://<render-host>, no trailing slash) and MARKET_API_TOKEN
# (same value as the backend env).

name: Scheduled data refresh
on:
  schedule:
    - cron: "0 14 * * 1-5"
    - cron: "30 21 * * 1-5"
  workflow_dispatch: {}

jobs:
  refresh:
    if: github.event_name == 'workflow_dispatch' || vars.REFRESH_ENABLED == 'true'
    runs-on: ubuntu-latest
    env:
      BACKEND_URL: ${{ secrets.BACKEND_URL }}
      MARKET_API_TOKEN: ${{ secrets.MARKET_API_TOKEN }}
    steps:
      - name: Require configuration
        run: |
          missing=""
          [ -n "$BACKEND_URL" ] || missing="$missing BACKEND_URL"
          [ -n "$MARKET_API_TOKEN" ] || missing="$missing MARKET_API_TOKEN"
          if [ -n "$missing" ]; then
            echo "::error::refresh is enabled but repo secret(s) not set:$missing — set them (docs/cutover-plan.md §4) or set repo variable REFRESH_ENABLED=false"
            exit 1
          fi
          echo "configured"

      - name: Trigger refresh
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H "X-API-Token: $MARKET_API_TOKEN" \
            "$BACKEND_URL/api/refresh")
          echo "refresh trigger -> HTTP $code"
          # 401 = bad/missing token; anything non-200 fails here
          test "$code" = "200"

      - name: Wait for the background refresh to finish
        run: |
          running=true
          for i in $(seq 1 60); do          # up to ~20 min (60 x 20s)
            running=$(curl -s "$BACKEND_URL/api/refresh/status" | jq -r '.running')
            echo "poll $i: running=$running"
            [ "$running" = "false" ] && break
            sleep 20
          done
          if [ "$running" != "false" ]; then
            echo "::error::refresh did not complete within timeout"
            exit 1
          fi

      - name: Report failed phases
        run: |
          body=$(curl -s "$BACKEND_URL/api/refresh/status")
          echo "$body"
          err=$(echo "$body" | jq -r '.last_run.error // empty')
          failed=$(echo "$body" | jq -r '(.last_run.failed_phases // []) | join(", ")')
          if [ -n "$err" ]; then
            echo "::error::refresh crashed before completing: $err"
            exit 1
          fi
          if [ -n "$failed" ]; then
            echo "::warning::refresh completed with failed phases: $failed"
          else
            echo "all phases succeeded"
          fi

      - name: Gate on data freshness
        run: |
          body=$(curl -s "$BACKEND_URL/api/freshness")
          echo "$body"
          fresh=$(echo "$body" | jq -r '.is_fresh')
          if [ "$fresh" != "true" ]; then
            echo "::error::refresh completed but data is not fresh — update likely failed"
            exit 1
          fi

      - name: Check system health
        run: |
          body=$(curl -s "$BACKEND_URL/api/system-health")
          status=$(echo "$body" | jq -r '.overall_status')
          echo "overall_status=$status"
          if [ "$status" = "down" ]; then
            echo "::error::system health reports down after refresh"
            exit 1
          fi
          if [ "$status" != "healthy" ]; then
            echo "::warning::system health is '$status' after refresh — some sources degraded"
          fi
